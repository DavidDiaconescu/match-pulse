# MatchPulse local stack.
#
#   docker compose up -d        start everything
#   docker compose ps           kafka should be "healthy", kafka-init "exited (0)"
#   docker compose down -v      stop and delete all data volumes
#
# Every image is pinned and multi-arch (linux/arm64 + linux/amd64).
# Values like ${KAFKA_UI_PORT:-8080} come from .env (see .env.example) or fall back
# to the default after ":-".

name: matchpulse

services:
  # ---------------------------------------------------------------------------
  # Kafka - single node in KRaft mode (it is its own controller, no ZooKeeper).
  # Owner: David
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:${KAFKA_IMAGE_TAG:-4.1.0}
    container_name: kafka
    hostname: kafka
    ports:
      # Only the host listener is published. Containers use kafka:9092 on the
      # internal Docker network, so 9092 does not need to be published.
      - "${KAFKA_HOST_PORT:-9094}:9094"
    environment:
      # --- KRaft: this one node is both broker and controller ----------------
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Fixed cluster id so the data volume can be reused across restarts.
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}

      # --- Listeners ---------------------------------------------------------
      # LISTENERS = the sockets Kafka binds to inside the container.
      # ADVERTISED_LISTENERS = the addresses Kafka tells clients to reconnect to.
      #   PLAINTEXT  -> kafka:9092      for other containers (Spark, producer in Docker)
      #   EXTERNAL   -> localhost:9094  for scripts run from the host terminal
      #   CONTROLLER -> :9093           KRaft internal traffic, never used by clients
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # --- Single node: internal topics cannot have more than 1 replica ------
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Topics are created explicitly by kafka-init with the right partition
      # counts, so a typo in a topic name fails loudly instead of creating a topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Healthy = the broker answers API requests on its internal listener.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # One-shot container that creates the Kafka topics, then exits with code 0.
  # It reuses the Kafka image only for its CLI tools (kafka-topics.sh).
  # Owner: David
  # ---------------------------------------------------------------------------
  kafka-init:
    image: apache/kafka:${KAFKA_IMAGE_TAG:-4.1.0}
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVER: kafka:9092
    volumes:
      - ./scripts/create-topics.sh:/scripts/create-topics.sh:ro
    entrypoint: ["bash", "/scripts/create-topics.sh"]
    restart: "no"

  # ---------------------------------------------------------------------------
  # Kafka UI (kafbat, the maintained fork of provectus kafka-ui).
  # Owner: David
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:${KAFKA_UI_IMAGE_TAG:-v1.3.0}
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: matchpulse
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
    restart: unless-stopped

  # ===========================================================================
  # >>> MIHAI: batch layer services
  # minio + minio-init below were added by David as a STARTING POINT so the
  # Streamlit app can be tested against a real S3 store. Mihai owns them: change
  # freely (keep bucket "lake" and the s3://lake/gold/<table> paths from
  # docs/gold-contract.md, or tell David).
  #
  # Image note: MinIO Inc. stopped publishing official Docker images in 2025
  # (minio/minio is gone from Docker Hub; quay.io needs login). pgsty/minio is a
  # community build of the same open-source MinIO server, multi-arch.
  # Still to add here: spark batch job container(s), if run in Docker.
  # ===========================================================================
  minio:
    image: pgsty/minio:${MINIO_IMAGE_TAG:-RELEASE.2026-08-04T00-00-00Z}
    container_name: minio
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_API_PORT:-9000}:9000"      # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"  # web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: create the "lake" bucket with the MinIO client (mc ships in the image).
  minio-init:
    image: pgsty/minio:${MINIO_IMAGE_TAG:-RELEASE.2026-08-04T00-00-00Z}
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      LAKE_BUCKET: ${LAKE_BUCKET:-lake}
    entrypoint: ["sh", "-c", "mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" && mc mb --ignore-existing local/$$LAKE_BUCKET"]
    restart: "no"

  # ===========================================================================
  # >>> DAYANA: speed layer services go here
  #   - redis       (live match state)
  #   - spark       (Structured Streaming job; Kafka bootstrap = kafka:9092,
  #                  add depends_on: kafka: condition: service_healthy)
  #   - grafana     (provisioning files in dashboards/grafana/)
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Replay producer - NOT started by `docker compose up` (profile "tools").
  # Run on demand:
  #   docker compose run --rm replay-producer --matches 3788741 --speed 60
  #   docker compose run --rm --entrypoint python replay-producer test_consumer.py --match 3788741
  # Owner: David
  # ---------------------------------------------------------------------------
  replay-producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    image: matchpulse/replay-producer:dev
    profiles: ["tools"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      # Read-write so statsbombpy can cache matches that are not downloaded yet.
      - ${DATA_DIR_HOST:-./data}:/data
      # Lets `make fetch-data` run scripts/fetch_statsbomb.py inside this image.
      - ./scripts:/scripts:ro

  # ---------------------------------------------------------------------------
  # Streamlit historical analytics app: http://localhost:8501
  # Reads gold Delta tables from MinIO with delta-rs (no Spark).
  # Owner: David
  # ---------------------------------------------------------------------------
  streamlit:
    build: ./dashboards/streamlit
    image: matchpulse/streamlit:dev
    container_name: streamlit
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    environment:
      GOLD_URI: s3://${LAKE_BUCKET:-lake}/gold
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      DATA_DIR: /data
    volumes:
      # Read-only: dev_fixtures.py reads local StatsBomb files to build sample tables.
      - ${DATA_DIR_HOST:-./data}:/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

volumes:
  kafka-data:
  minio-data:
